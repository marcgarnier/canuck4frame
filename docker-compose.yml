# Convenience wrapper. `docker compose run pipeline` or `docker compose up jupyter`.
services:
  pipeline:
    build: .
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    command: python scripts/run_pipeline.py --sample

  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser
      --NotebookApp.token=''
