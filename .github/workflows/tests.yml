name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The lightweight test suite (cleaning, language detection, chi-square)
      # only needs these deps — NOT the full ML stack — so CI stays fast and
      # doesn't download torch / sentence-transformers. trafilatura is required
      # because src/collect.py imports it at module load.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scipy requests beautifulsoup4 lxml trafilatura \
                      tenacity tqdm langdetect python-dotenv pyyaml pytest

      - name: Run tests
        run: pytest tests/ -q
